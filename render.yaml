# Render Blueprint for 100% Free Zero-Configuration Deployment
services:
  # -------------------------------------------------------------
  # Backend: Java 17 + Spring Boot Web Service
  # -------------------------------------------------------------
  - type: web
    name: campusfix-backend
    runtime: java
    region: ohio
    plan: free
    rootDir: backend
    buildCommand: chmod +x mvnw && ./mvnw clean package -DskipTests
    startCommand: java -jar target/campusfix-backend-1.0.0.jar
    envVars:
      - key: SPRING_DATASOURCE_URL
        value: jdbc:mysql://gateway01.us-east-1.prod.aws.tidbcloud.com:4000/campusfix?sslMode=VERIFY_IDENTITY
      - key: SPRING_DATASOURCE_USERNAME
        value: 3q7KXcjyNVZcFNx.root
      - key: SPRING_DATASOURCE_PASSWORD
        sync: false
      - key: JWT_SECRET
        value: CampusFixSuperSecretKeyForJWTSigningAndAuth2026SecureBTechProject
      - key: JWT_EXPIRATION
        value: 86400000
      - key: DDL_AUTO
        value: validate
      - key: CORS_ALLOWED_ORIGINS
        value: "*"
