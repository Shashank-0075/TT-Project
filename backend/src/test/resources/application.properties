# Test configuration: an in-memory H2 database, so tests never touch the real MySQL data.
spring.datasource.url=jdbc:h2:mem:campusfix_test;MODE=MySQL;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false

# Test-only secret (not used anywhere else)
campusfix.jwt.secret=test-secret-key-test-secret-key-test-secret-key-1234
campusfix.jwt.expiration-ms=3600000

campusfix.upload.dir=target/test-uploads
campusfix.upload.max-file-size-bytes=5242880
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB

campusfix.cors.allowed-origins=http://localhost:5173

# Disable the automatic scheduler in tests (tests call the escalation service directly)
campusfix.escalation.check-interval-ms=86400000
campusfix.escalation.initial-delay-ms=86400000
campusfix.escalation.default-low-to-medium-days=3
campusfix.escalation.default-medium-to-high-days=3

springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false
