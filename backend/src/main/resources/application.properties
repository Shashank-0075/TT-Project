# =====================================================================
# CampusFix backend configuration
#
# Secrets (database password, JWT secret) are NOT stored in this file.
# They are read from environment variables, or from a local file called
# ".env" placed in the backend folder (copy ".env.example" to ".env").
# The ".env" file is listed in .gitignore so it is never committed.
# =====================================================================

spring.application.name=campusfix-backend
server.port=${PORT:${SERVER_PORT:8080}}

# Optionally load KEY=VALUE pairs from backend/.env
spring.config.import=optional:file:.env[.properties]

# ---------------- Database (MySQL / TiDB Cloud) ----------------
spring.datasource.url=${SPRING_DATASOURCE_URL:${DATABASE_URL:jdbc:mysql://localhost:3306/campusfix?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Kolkata}}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:${DATABASE_USERNAME:root}}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:${DATABASE_PASSWORD}}

# ---------------- JPA / Hibernate ----------------
# "validate" verifies entities match existing tables. In production on TiDB/Render,
# DDL_AUTO can also be set to "update" or "validate".
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:validate}
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=Asia/Kolkata
spring.jpa.show-sql=false

# ---------------- JWT ----------------
# JWT_SECRET must be at least 32 characters long (no default on purpose).
campusfix.jwt.secret=${JWT_SECRET}
# Token validity in milliseconds (default 24 hours)
campusfix.jwt.expiration-ms=${JWT_EXPIRATION:86400000}

# ---------------- File upload / Cloudinary ----------------
campusfix.upload.dir=${UPLOAD_DIR:uploads}
campusfix.upload.max-file-size-bytes=5242880
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB

# Cloudinary (Optional: used when deploying to free clouds like Render where disk is ephemeral)
cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME:}
cloudinary.api-key=${CLOUDINARY_API_KEY:}
cloudinary.api-secret=${CLOUDINARY_API_SECRET:}

# ---------------- CORS (React client / Render URL) ----------------
campusfix.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173,http://localhost:3000}

# ---------------- Automatic priority escalation ----------------
# How often the scheduler checks unresolved complaints (milliseconds). Default: 1 hour.
campusfix.escalation.check-interval-ms=${ESCALATION_CHECK_INTERVAL_MS:3600000}
# Delay before the first check after the application starts (milliseconds).
campusfix.escalation.initial-delay-ms=15000
# Default thresholds used only the first time (they are then stored in the
# escalation_config table and can be changed by the admin from the UI).
campusfix.escalation.default-low-to-medium-days=3
campusfix.escalation.default-medium-to-high-days=3

# ---------------- OpenAPI / Swagger ----------------
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs

# Hide stack traces from API consumers
server.error.include-stacktrace=never
server.error.include-message=never
